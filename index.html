<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 25px;
            color: #222;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .download-btn {
            display: block;
            background: #16a34a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #15803d;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📱</div>

        <h1>My APK App</h1>

        <p>Download the latest version of our Android app.</p>

        <a class="download-btn"
           href="https://raw.githubusercontent.com/mahinurshifatsimanto3-ops/App/main/app.apk"
            ⬇ DOWNLOAD APK
        </a>

        <div class="footer">
            Android APK • Latest Version
        </div>

    </div>

</body>
</html>
